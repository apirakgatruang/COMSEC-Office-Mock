t }}\" sc-camel-on-change=\"{{ a.onT }}\" style=\"min-height:36px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:8px;align-items:center;font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\"><span class=\"{{ a.tagCls }}\" style=\"padding:0 6px;font-size:10px\">{{ a.tag }}<\u002Fspan><span>{{ a.srcTxt }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ a.del }}\" style=\"color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ลบ<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ addAg }}\" style=\"align-self:flex-start\">+ เพิ่มวาระ<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\"><h3 style=\"font-size:19px;margin:0\">เอกสารประกอบการประชุม<\u002Fh3><a href=\"#\" sc-camel-on-click=\"{{ invDocs.goFold }}\" style=\"font-size:13px\">เก็บใน Meeting Folder: {{ invDocs.folder }} ({{ invDocs.n }})<\u002Fa><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:var(--color-surface);border:1px dashed color-mix(in srgb,var(--color-text) 30%,transparent);border-radius:4px\">\n        <span style=\"font-weight:600;font-size:14px\">แนบไฟล์ของ<\u002Fspan>\n        <sc-raw-select class=\"input\" value=\"{{ invDocs.upAg }}\" sc-camel-on-change=\"{{ invDocs.onUpAg }}\" style=\"flex:1 1 260px;min-width:0;min-height:36px;font-size:13px\"><sc-for list=\"{{ invDocs.agOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n        <label class=\"btn btn-primary\" style=\"cursor:pointer\">เลือกไฟล์<input type=\"file\" multiple=\"\" sc-camel-on-change=\"{{ invDocs.onUpload }}\" style=\"display:none\"><\u002Flabel>\n        <span style=\"flex-basis:100%;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">PDF, DOCX, XLSX, PPTX, JPG, PNG, ZIP · ระบบเปลี่ยนชื่อไฟล์ตามรูปแบบ “[ประเภท]#[ปี-ครั้งที่] วาระ [เลขวาระ]_[ชื่อไฟล์]” และจัดเก็บเข้า Meeting Folder ของการประชุมนี้ทันที<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ invDocs.noRows }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ยังไม่มีเอกสารประกอบของการประชุมนี้<\u002Fdiv><\u002Fsc-if>\n      <sc-for list=\"{{ invDocs.rows }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:13.5px\">\n          <span class=\"tag tag-neutral\" style=\"justify-content:center\">{{ f.ext }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;min-width:0\"><span style=\"font-weight:600;word-break:break-all\">{{ f.n }}<\u002Fspan><span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 58%,transparent)\">{{ f.ver }} · {{ f.at }} · {{ f.by }}<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ f.view }}\" style=\"font-size:12.5px;padding:3px 8px\">ดู<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ f.dl }}\" style=\"font-size:12.5px;padding:3px 8px\">ดาวน์โหลด<\u002Fbutton><label class=\"btn btn-secondary\" style=\"font-size:12.5px;padding:3px 10px;min-height:0;cursor:pointer\">อัปโหลดฉบับแก้ไข<input type=\"file\" sc-camel-on-change=\"{{ f.onUp }}\" style=\"display:none\"><\u002Flabel><sc-if value=\"{{ f.canRm }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ f.rm }}\" style=\"font-size:12.5px;padding:3px 8px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ลบ<\u002Fbutton><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ confirmDoc }}\" style=\"padding:12px 22px\">ยืนยันข้อมูลและดูตัวอย่างเอกสาร<\u002Fbutton><span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">ดาวน์โหลดและส่งขออนุมัติได้หลังยืนยัน<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ minEdit }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:36px;max-width:880px\">\n    <section style=\"display:flex;flex-direction:column;gap:14px;padding:16px 20px;border:1px solid var(--color-divider);border-radius:8px;background:#fff\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700)\">Document Control<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-size:17px;font-weight:700\">Rev.{{ rv.cur }}<\u002Fspan><span class=\"{{ rv.curCls }}\">{{ rv.curSt }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent);word-break:break-all\">{{ doc.file }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ rv.openForm }}\">+ สร้าง Revision ใหม่<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ rv.locked }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 14px;border-radius:6px;background:oklch(0.94 0.05 80);color:oklch(0.4 0.09 70);font-size:13.5px\">Rev.{{ rv.cur }} ไม่ใช่ฉบับร่าง จึงแก้ไขไม่ได้ — สร้าง Revision ใหม่เพื่อแก้ไขต่อ<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ rv.form }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:6px;background:var(--color-accent-100)\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n            <div class=\"field\"><label>ตั้งต้นจาก Revision<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ rv.base }}\" sc-camel-on-change=\"{{ rv.onBase }}\"><sc-for list=\"{{ rv.opts }}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n            <div class=\"field\"><label>เหตุผลการแก้ไข *<\u002Flabel><input class=\"input\" value=\"{{ rv.note }}\" sc-camel-on-change=\"{{ rv.onNote }}\" placeholder=\"เช่น แก้ไขตามความเห็นผู้ตรวจสอบ\"><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ rv.hasDraft }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ rv.draftNote }}<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ rv.create }}\">สร้าง Rev.{{ rv.next }}<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ rv.openForm }}\">ยกเลิก<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"overflow-x:auto\"><div style=\"min-width:760px;display:flex;flex-direction:column\">\n        <div style=\"display:grid;grid-template-columns:62px 100px 110px 80px minmax(200px,1fr) 190px 90px;gap:8px;padding:0 6px 6px;font-size:12.5px;font-weight:600;color:var(--color-neutral-700);border-bottom:1px solid var(--color-divider)\"><span>Rev.<\u002Fspan><span>วันที่<\u002Fspan><span>ผู้จัดทำ<\u002Fspan><span>ตั้งต้นจาก<\u002Fspan><span>เหตุผลการแก้ไข<\u002Fspan><span>สถานะ<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ rv.list }}\" as=\"x\" hint-placeholder-count=\"2\">\n          <div style=\"display:grid;grid-template-columns:62px 100px 110px 80px minmax(200px,1fr) 190px 90px;gap:8px;padding:7px 6px;align-items:center;font-size:13.5px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);background:{{ x.bg }}\">\n            <span style=\"font-weight:700\">{{ x.rev }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ x.date }}<\u002Fspan><span>{{ x.by }}<\u002Fspan><span>{{ x.base }}<\u002Fspan><span>{{ x.note }}<\u002Fspan><span><span class=\"{{ x.stCls }}\">{{ x.stTxt }}<\u002Fspan><\u002Fspan>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ x.use }}\" style=\"font-size:12.5px;padding:2px 6px\">ใช้ตั้งต้น<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:14px;font-weight:600;color:var(--color-neutral-800)\">1. หนังสือเชิญประชุมตั้งต้น<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px\">\n        <sc-for list=\"{{ recs }}\" as=\"rc\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ rc.pick }}\" class=\"card\" style=\"text-align:left;font:inherit;color:inherit;cursor:pointer;border:2px solid {{ rc.bd }}\">\n            <span class=\"card-kicker\">หนังสือเชิญประชุม · {{ rc.badge }}<\u002Fspan>\n            <span class=\"card-title\">{{ rc.t }} ครั้งที่ {{ rc.no }}<\u002Fspan>\n            <span class=\"card-meta\">{{ rc.date }} · {{ rc.agN }} วาระ<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ระเบียบวาระ วันที่ และรายชื่อผู้เข้าร่วมประชุมตั้งต้นจากหนังสือเชิญประชุมที่เลือก<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:14px;font-weight:600;color:var(--color-neutral-800)\">2. วิธีจัดทำรายงานการประชุม<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n        <button sc-camel-on-click=\"{{ setModeTeams }}\" style=\"display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:{{ mT.bg }};border:2px solid {{ mT.bd }};border-radius:8px;padding:14px 16px;cursor:pointer\"><i class=\"ph-duotone ph-microsoft-teams-logo\" style=\"font-size:28px;color:var(--color-accent-700)\"><\u002Fi><span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:600;font-size:15px\">Upload Teams record<\u002Fspan><span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">อัปโหลดไฟล์บันทึกการประชุม แล้วให้ระบบถอดเสียงและสรุปเป็นรายงาน<\u002Fspan><\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setModeManual }}\" style=\"display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:{{ mM.bg }};border:2px solid {{ mM.bd }};border-radius:8px;padding:14px 16px;cursor:pointer\"><i class=\"ph-duotone ph-keyboard\" style=\"font-size:28px;color:var(--color-accent-700)\"><\u002Fi><span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:600;font-size:15px\">พิมพ์เอง (Manual)<\u002Fspan><span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">พิมพ์สาระสำคัญ ความคิดเห็น และมติของแต่ละวาระเอง<\u002Fspan><\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ minTeams }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:8px;background:var(--color-accent-100)\">\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <label class=\"btn btn-secondary\" style=\"cursor:pointer;background:#fff\"><input type=\"file\" accept=\".mp4,.m4a,.mp3,.wav,.vtt,.docx\" sc-camel-on-change=\"{{ onMinFile }}\" style=\"display:none\">อัปโหลดไฟล์ Teams record<\u002Flabel>\n            <span style=\"font-size:13.5px\">{{ minFileTxt }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700)\">รองรับ .mp4 .m4a .mp3 .wav หรือไฟล์ transcript .vtt / .docx จาก Microsoft Teams<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ analyzeMin }}\" disabled=\"{{ minBusy }}\">{{ analyzeTxt }}<\u002Fbutton>\n            <sc-if value=\"{{ minBusy }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;align-items:center;gap:8px;font-size:13px\"><span style=\"width:160px;height:6px;background:#fff;border-radius:3px;overflow:hidden\"><span style=\"display:block;height:6px;width:{{ minPctW }};background:var(--color-accent)\"><\u002Fspan><\u002Fspan>{{ minPctW }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px\">\n            <sc-for list=\"{{ pipe }}\" as=\"p\" hint-placeholder-count=\"5\"><span style=\"color:{{ p.c }}\">{{ p.mark }} {{ p.t }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ minManual }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:12px 16px;border-radius:8px;background:var(--color-neutral-100);font-size:13.5px\">ระเบียบวาระตั้งต้นจากหนังสือเชิญประชุมแล้ว — พิมพ์รายละเอียดแต่ละวาระด้านล่าง และเพิ่มวาระเองได้<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <h3 style=\"font-size:19px;margin:0\">กรรมการผู้เข้าร่วมประชุม<\u002Fh3>\n        <span class=\" :14px\"><span style=\"font-variant-numeric:tabular-nums;color:var(--color-accent-700)\">{{ cm.d }}<\u002Fspan><span><b>{{ cm.who }}<\u002Fb> — {{ cm.t }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isExt }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:26px;max-width:794px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);font-size:13px;border-radius:2px\"><span>มุมมองจำลอง: หน้าที่ผู้อนุมัติภายนอกเห็นเมื่อคลิกลิงก์<\u002Fspan><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ backFromExt }}\" style=\"color:var(--color-accent-2-800)\">← กลับสู่ระบบ<\u002Fbutton><\u002Fdiv>\n    <header style=\"display:flex;flex-direction:column;gap:6px\">\n      <img src=\"f389842c-a2fb-4139-864d-50b4be3f76d7\" alt=\"BAYCOMS\" style=\"height:40px;width:auto;align-self:flex-start;margin:0 0 6px -8px\"><div style=\"font-size:12px;letter-spacing:.04em;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">บริษัท เบย์ คอมพิวติ้ง จำกัด (มหาชน) · คำขออนุมัติเอกสาร<\u002Fdiv>\n      <h1 style=\"font-size:18px;font-weight:600;line-height:1.35;margin:0;word-break:break-word\">{{ ext.doc }}<\u002Fh1>\n      <div style=\"font-size:14px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ ext.kind }} · เรียน {{ ext.who }} ({{ ext.role }}) · ขั้นที่ {{ ext.stepNo }} จาก {{ ext.total }} · ส่งโดย นางสาวสาริสา ฉัตรคามณ์ เลขานุการบริษัท<\u002Fdiv>\n    <\u002Fheader>\n    <sc-if value=\"{{ ext.hasDecl }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:13.5px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">โปรดตรวจสอบข้อมูลในแบบรายงานด้านล่าง หากถูกต้องครบถ้วนให้กด \"อนุมัติ\" เพื่อยืนยันและลงนามทางอิเล็กทรอนิกส์ หากต้องแก้ไขให้ส่งกลับพร้อมระบุความเห็น<\u002Fdiv><iframe sc-camel-src-doc=\"{{ ext.declHtml }}\" title=\"Declaration form\" style=\"width:100%;height:70vh;border:1px solid var(--color-divider);border-radius:6px;background:#e9e7e4\"><\u002Fiframe><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ ext.choose }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n        <button class=\"card\" sc-camel-on-click=\"{{ extReview }}\" style=\"text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid transparent;padding:22px\" style-hover=\"border-color:var(--color-accent)\"><span class=\"card-kicker\">Review<\u002Fspan><span class=\"card-title\">ตรวจทานเอกสารก่อน<\u002Fspan><span class=\"card-body\">เปิดอ่านเอกสารฉบับเต็ม แสดงความเห็น แล้วเลือกอนุมัติหรือส่งกลับแก้ไข<\u002Fspan><\u002Fbutton>\n        <button class=\"card\" sc-camel-on-click=\"{{ extApprove }}\" style=\"text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid transparent;padding:22px\" style-hover=\"border-color:var(--color-accent)\"><span class=\"card-kicker\">Approve<\u002Fspan><span class=\"card-title\">อนุมัติทันที<\u002Fspan><span class=\"card-body\">{{ ext.approveHint }}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ ext.review }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div class=\"field\"><label>ความเห็น (จำเป็นเมื่อส่งกลับแก้ไข)<\u002Flabel><textarea class=\"input\" rows=\"2\" value=\"{{ ext.note }}\" sc-camel-on-change=\"{{ onExtNote }}\"><\u002Ftextarea><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ extApprove }}\">อนุมัติ<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ extReturn }}\">ส่งกลับแก้ไข<\u002Fbutton><span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent);align-self:center\">{{ ext.approveHint }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ ext.doneOk }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:17px;font-weight:600;color:var(--color-accent-700)\">{{ ext.okTxt }}<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ ext.doneRet }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:17px;font-weight:600;color:var(--color-accent-2-700)\">ส่งกลับแก้ไขแล้ว ผู้จัดทำได้รับความเห็นของท่าน<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ ext.closed }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:16px\">ลิงก์นี้ได้ดำเนินการแล้วหรือหมดอายุ<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAuth }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:40px;max-width:1120px\">\n    <header style=\"display:flex;flex-direction:column;gap:8px;max-width:780px\">\n      <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Setting · Authorization<\u002Fdiv>\n      <h1 style=\"font-size:18px;font-weight:600;line-height:1.35;margin:0\">ผู้ใช้งานและสิทธิ์<\u002Fh1>\n      <p style=\"font-size:15px;margin:0;text-wrap:pretty;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">ระบบนี้มีผู้ใช้งาน 2 กลุ่มเท่านั้น สิทธิ์ของแต่ละกลุ่มกำหนดไว้ตายตัว ผู้ดูแลระบบเพียงเพิ่มหรือลบรายชื่อ และกำหนดคณะกรรมการที่กรรมการแต่ละท่านสังกัด<\u002Fp>\n    <\u002Fheader>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:10px;background:#fff;border:1px solid var(--color-divider);border-top:4px solid var(--color-accent)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><span style=\"font-weight:700;font-size:16px\">ผู้ดูแลระบบ<\u002Fspan><span class=\"tag tag-accent\">{{ usr.nAdm }} คน<\u002Fspan><\u002Fdiv>\n        <span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">เลขานุการบริษัท และผู้ช่วยเลขานุการบริษัท<\u002Fspan>\n        <ul style=\"margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.75\"><li>กำหนดสิทธิ์ผู้ใช้งาน<\u002Fli><li>สร้างและแก้ไขเอกสาร<\u002Fli><li>อัปโหลดไฟล์<\u002Fli><li>ส่งขออนุมัติ<\u002Fli><li>เห็นข้อมูลทุกคณะ<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:10px;background:#fff;border:1px solid var(--color-divider);border-top:4px solid oklch(0.62 0.12 160)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><span style=\"font-weight:700;font-size:16px\">กรรมการบริษัท<\u002Fspan><span class=\"tag tag-accent\">{{ usr.nDir }} ท่าน<\u002Fspan><\u002Fdiv>\n        <span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">ดูได้เฉพาะการประชุมของคณะที่ตนเป็นกรรมการ (AGM / EGM เห็นทุกท่าน)<\u002Fspan>\n        <ul style=\"margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.75\"><li>เปิดดูเอกสาร<\u002Fli><li>เขียนความเห็นบนเอกสาร — เห็นเฉพาะตนเอง ไม่บันทึกทับต้นฉบับ<\u002Fli><li>อนุมัติเอกสารที่ได้รับมอบหมาย<\u002Fli><li style=\"color:color-mix(in srgb,var(--color-text) 55%,transparent)\">ไม่สามารถสร้าง แก้ไข หรืออัปโหลดเอกสาร<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"display:flex;flex-direction:column;gap:8px\">\n      <h3 style=\"font-size:19px;margin:0\">ผู้ดูแลระบบ<\u002Fh3>\n      <sc-for list=\"{{ usr.admins }}\" as=\"u\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid;grid-template-columns:minmax(200px,1fr) minmax(180px,1fr) minmax(200px,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:14px\">\n          <span style=\"font-weight:600\">{{ u.n }}<\u002Fspan><span>{{ u.r }}<\u002Fspan><span style=\"color:color-mix(in srgb,var(--color-text) 62%,transparent)\">{{ u.e }}<\u002Fspan>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ u.rm }}\" style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ยกเลิกสิทธิ์<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <section style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\"><h3 style=\"font-size:19px;margin:0\">กรรมการบริษัท และคณะที่สังกัด<\u002Fh3><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ usr.importDirs }}\">ดึงรายชื่อจากทะเบียนกรรมการ<\u002Fbutton><\u002Fdiv>\n      <div style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">กดชื่อคณะเพื่อเปิด/ปิด — กรรมการเห็นเอกสาร Meeting Index และ Meeting Folders เฉพาะคณะที่เลือก<\u002Fdiv>\n      <sc-if value=\"{{ usr.noDirs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13.5px;padding:10px 0;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ยังไม่มีกรรมการในระบบ<\u002Fdiv><\u002Fsc-if>\n      <sc-for list=\"{{ usr.dirs }}\" as=\"u\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:minmax(200px,1fr) minmax(200px,1fr) minmax(300px,1.4fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);font-size:14px\">\n          <span style=\"display:flex;flex-direction:column\"><span style=\"font-weight:600\">{{ u.n }}<\u002Fspan><span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ u.r }}<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;font-size:13px\"><span>{{ u.e }}<\u002Fspan><span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ u.ch }}<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\"><span class=\"tag tag-neutral\" title=\"ประชุมผู้ถือหุ้น เห็นทุกท่าน\">AGM/EGM<\u002Fspan><sc-for list=\"{{ u.chips }}\" as=\"c\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ c.pick }}\" title=\"{{ c.full }}\" style=\"font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }}\">{{ c.t }}<\u002Fbutton><\u002Fsc-for><\u002Fspan>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ u.rm }}\" style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ยกเลิกสิทธิ์<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <div style=\"font-size:13.5px;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--color-accent) 6%,transparent)\">เพิ่มผู้ใช้งาน แก้ไขอีเมล และกำหนดกลุ่ม (ผู้ดูแลระบบ / กรรมการ) ได้ที่หน้า <a href=\"#\" sc-camel-on-click=\"{{ goSig }}\">Employee Information<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <h3 style=\"font-size:19px;margin:0\">สิทธิ workflow การอนุมัติ<\u002Fh3>\n      <div style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ค่าตั้งต้นของผู้ตรวจสอบและผู้อนุมัติแต่ละขั้นตอนเมื่อส่งขออนุมัติจากเมนู Meeting Document (แก้ไขได้ในแต่ละคำขอ) · ผู้อนุมัติขั้นสุดท้ายเป็นผู้ประทับลายเซ็น<\u002Fdiv>\n      <sc-for list=\"{{ wfr }}\" as=\"w\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font-weight:600;font-size:15.5px\">{{ w.t }}<\u002Fspan><span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ผู้สร้างคำขอ: ผู้ดูแลระบบ<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ w.steps }}\" as=\"st\" hint-placeholder-count=\"2\">\n            <div style=\"display:grid;grid-template-columns:62px 150px minmax(0,1fr) auto;gap:10px;align-items:center\">\n              <span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ขั้นที่ {{ st.i }}<\u002Fspan>\n              <input class=\"input\" value=\"{{ st.label }}\" sc-camel-on-change=\"{{ st.onLabel }}\" style=\"min-height:32px\">\n              <sc-raw-select class=\"input\" value=\"{{ st.pid }}\" sc-camel-on-change=\"{{ st.onPick }}\" style=\"min-height:34px;font-size:13.5px;max-width:420px\"><option value=\"\">— เลือกผู้ใช้งาน —<\u002Foption><sc-for list=\"{{ st.people }}\" as=\"pp\" hint-placeholder-count=\"5\"><option value=\"{{ pp.v }}\">{{ pp.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ st.del }}\" style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ลบ<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ w.hasAuto }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:62px 150px minmax(0,1fr) auto;gap:10px;align-items:center\">\n              <span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ขั้นที่ {{ w.autoNo }}<\u002Fspan>\n              <span class=\"input\" style=\"min-height:32px;display:flex;align-items:center;background:color-mix(in srgb,var(--color-text) 4%,transparent)\">อนุมัติ<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:8px;min-height:34px;max-width:420px;padding:4px 10px;border:1px dashed oklch(0.62 0.12 160);border-radius:4px;background:oklch(0.97 0.025 160);font-size:13.5px\"><i class=\"ph-duotone ph-lock-simple\" style=\"font-size:16px;color:oklch(0.42 0.1 160)\"><\u002Fi>ผู้รายงาน (เจ้าของข้อมูลที่ Declare) — กำหนดอัตโนมัติตามแบบรายงานแต่ละฉบับ<\u002Fspan>\n              <span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">ลบไม่ได้<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ w.add }}\" style=\"align-self:flex-start;font-size:13px\">+ เพิ่มขั้นตอน<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveAuth }}\" style=\"padding:12px 22px\">บันทึกการตั้งค่าสิทธิ์<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEmp }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:28px;max-width:1120px\">\n    <header style=\"display:flex;flex-direction:column;gap:8px;max-width:780px\">\n      <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Setting · Employee Information<\u002Fdiv>\n      <h1 style=\"font-size:18px;font-weight:600;line-height:1.35;margin:0\">Employee Information<\u002Fh1>\n      <p style=\"font-size:15px;margin:0;text-wrap:pretty;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">ข้อมูลพนักงานซิงก์จาก AD ของบริษัท (ชื่อ ตำแหน่ง แผนก อีเมล บัญชีผู้ใช้) อัปโหลดรูปลายเซ็นสำหรับประทับในเอกสาร และเพิ่มผู้อนุมัติภายนอกองค์กรเองได้ รายชื่อนี้ใช้เลือกผู้อนุมัติใน workflow<\u002Fp>\n    <\u002Fheader>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:13.5px\">\n      <span class=\"tag tag-accent\">Microsoft Entra ID (AD) เชื่อมต่อแล้ว<\u002Fspan><span>Tenant baycoms.onmicrosoft.com<\u002Fspan><span style=\"color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ซิงก์ล่าสุด {{ adSync }}<\u002Fspan>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ syncAd }}\">ซิงก์จาก AD<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggleCode }}\">{{ codeBtn }}<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showCode }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ตัวอย่างโค้ดเชื่อมต่อ (ไฟล์เต็ม: integration/m365-integration.js) · Microsoft Graph · สิทธิ์ User.Read.All, GroupMember.Read.All, Sites.Selected<\u002Fdiv>\n        <pre style=\"margin:0;padding:16px 18px;background:var(--color-accent-900);color:#e8edf3;font:12.5px/1.6 'Leelawadee UI',sans-serif;overflow:auto;border-radius:2px;max-width:960px\">const ROLE_MAP = { 'SG-CorpSec-Admin': 'admin', 'SG-CorpSec-Staff': 'staff',\n  'SG-Board-Directors': 'dir', 'SG-Committee-Members': 'cm', 'SG-CorpSec-Viewer': 'view' };\n\n// Employees: Entra ID users -&gt; Employee Information\nconst users = await pageAll(graph.api('/users')\n  .select('id,displayName,jobTitle,department,mail,userPrincipalName,userType')\n  .filter('accountEnabled eq true').top(999));\nfor (const u of users) await db.employees.upsert({ adObjectId: u.id, name: u.displayName,\n  position: u.jobTitle, department: u.department, email: u.mail, upn: u.userPrincipalName,\n  external: u.userType === 'Guest', source: 'AD' });   // signature stays in app DB\n\n// Roles: AD group membership -&gt; app role\nfor (const [group, role] of Object.entries(ROLE_MAP)) {\n  const g = await graph.api('/groups').filter(\"displayName eq '\" + group + \"'\").get();\n  const members = await pageAll(graph.api('/groups/' + g.value[0].id + '/transitiveMembers'));\n  for (const m of members) await db.employees.setRole(m.id, role);\n}\n\n// Every API route checks the Authorization matrix\nconst can = (user, fn, level) =&gt; LEVELS.indexOf(perms[user.role][fn]) &gt;= LEVELS.indexOf(level);<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap: )\">🔒 คำตอบของท่านจะส่งกลับเข้าระบบโดยตรง และเปิดดูได้เฉพาะสำนักเลขานุการบริษัท (ผู้ดูแลระบบ) — การรายงานต่อคณะกรรมการเป็นผลสรุปภาพรวม ไม่เปิดเผยคำตอบรายบุคคล<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--color-bg);border-bottom:1px solid var(--color-divider)\">\n      <span style=\"font-size:13px;white-space:nowrap\">ตอบแล้ว <b>{{ ev.x.a }}<\u002Fb> / {{ ev.x.n }} ข้อ<\u002Fspan>\n      <span style=\"flex:1;height:8px;border-radius:999px;background:color-mix(in srgb,var(--color-text) 8%,transparent);overflow:hidden\"><span style=\"display:block;height:100%;width:{{ ev.x.w }};background:var(--color-accent)\"><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ ev.x.secs }}\" as=\"sec\" hint-placeholder-count=\"3\">\n      <section style=\"display:flex;flex-direction:column;gap:10px\">\n        <h2 style=\"font-size:16.5px;margin:6px 0 0;padding:8px 12px;border-radius:8px;background:var(--color-accent-100);color:var(--color-accent-800)\">{{ sec.no }}. {{ sec.t }}<\u002Fh2>\n        <sc-for list=\"{{ sec.rows }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <sc-if value=\"{{ q.h }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-weight:600;font-size:14.5px;padding:4px 2px 0\">{{ q.no }} {{ q.t }}<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ q.q }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid {{ q.bd }};border-radius:10px;background:{{ q.bg }}\">\n              <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.55\"><b style=\"color:var(--color-accent-700)\">{{ q.no }}<\u002Fb><span>{{ q.t }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-left:60px\">\n                <sc-for list=\"{{ q.opts }}\" as=\"o\" hint- lex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Calendar · ปฏิทินการประชุม<\u002Fdiv><div style=\"display:flex;align-items:center;gap:10px\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cal.prev }}\" title=\"เดือนก่อน\" style=\"padding:4px 12px;font-size:18px;line-height:1\">‹<\u002Fbutton><h1 style=\"font-size:24px;font-weight:700;margin:0;min-width:200px;text-align:center\">{{ cal.title }}<\u002Fh1><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cal.next }}\" title=\"เดือนถัดไป\" style=\"padding:4px 12px;font-size:18px;line-height:1\">›<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cal.today }}\" style=\"font-size:13px\">เดือนนี้<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><sc-for list=\"{{ cal.legend }}\" as=\"l\" hint-placeholder-count=\"6\"><span style=\"display:inline-flex;align-items:center;gap:5px;font-size:12px\"><span style=\"width:12px;height:12px;border-radius:3px;background:{{ l.bg }};border:1px solid {{ l.fg }}\"><\u002Fspan>{{ l.t }}<\u002Fspan><\u002Fsc-for><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ cal.openNew }}\">+ เพิ่มนัดประชุม<\u002Fbutton><\u002Fdiv>\n    <\u002Fheader>\n    <div style=\"display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap\">\n      <div style=\"flex:999 1 640px;min-width:0;display:flex;flex-direction:column;border:1px solid var(--color-divider);border-radius:10px;overflow:hidden;background:#fff\">\n        <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:color-mix(in srgb,var(--color-text) 4%,#fff);border-bottom:1px solid var(--color-divider)\"><sc-for list=\"{{ cal.heads }}\" as=\"h\" hint-placeholder-count=\"7\"><span style=\"padding:8px 10px;font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--color-text) 65%,transparent)\">{{ h }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n        <sc-for list=\"{{ cal.weeks }}\" as=\"w\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)\">\n            <sc-for list=\"{{ w.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <div sc-camel-on-double-click=\"{{ d.add }}\" title=\"ดับเบิลคลิกเพื่อเพิ่มนัดประชุม\" style=\"min-height:104px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;background:{{ d.bg }};border-right:1px solid color-mix(in srgb,var(--color-text) 7%,transparent);min-width:0\">\n                <span style=\"font-size:13px;font-weight:600;color:{{ d.fg }};padding-left:2px\">{{ d.n }}<sc-if value=\"{{ d.isToday }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:6px;font-size:10.5px;font-weight:600;color:#fff;background:var(--color-accent);border-radius:999px;padding:1px 7px\">วันนี้<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                <sc-for list=\"{{ d.evs }}\" as=\"e\" hint-placeholder-count=\"1\"><button sc-camel-on-click=\"{{ e.pick }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;font:inherit;width:100%;min-width:0;padding:4px 7px;border:0;border-left:3px solid {{ e.fg }};border-radius:5px;background:{{ e.bg }};color:{{ e.fg }};opacity:{{ e.op }};cursor:pointer\"><span style=\"font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%\">{{ e.label }}<\u002Fspan><sc-if value=\"{{ e.hasTime }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11.5px;font-variant-numeric:tabular-nums\">{{ e.time }}<\u002Fspan><\u002Fsc-if><\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 300px;min-width:260px;display:flex;flex-direction:column;gap:14px\">\n        <sc-if value=\"{{ cal.hasNew }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--color-accent);border-radius:10px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\"><b>เพิ่มนัดประชุม<\u002Fb><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cal.closeNew }}\" style=\"font-size:13px\">ปิด<\u002Fbutton><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <div class=\"field\"><label>คณะ<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ cal.nw.t }}\" sc-camel-on-change=\"{{ cal.onNt }}\"><option>BOD<\u002Foption><option>AC<\u002Foption><option>NRC<\u002Foption><option>RMC<\u002Foption><option>EXCOM<\u002Foption><option>AGM<\u002Foption><option>EGM<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n              <div class=\"field\"><label>ครั้งที่/ปี<\u002Flabel><input class=\"input\" value=\"{{ cal.nw.no }}\" sc-camel-on-change=\"{{ cal.onNno }}\" placeholder=\"5/2569\"><\u002Fdiv>\n              <div class=\"field\"><label>วันที่<\u002Flabel><div data-date=\"1\" style=\"position:relative;display:flex\"><input data-dt=\"1\" sc-camel-max-length=\"10\" sc-camel-input-mode=\"numeric\" class=\"input\" value=\"{{ cal.nw.date }}\" sc-camel-on-change=\"{{ cal.onNd }}\" placeholder=\"วว-ดด-ปปปป\" style=\"padding-right:34px;flex:1;min-width:0\"><span style=\"position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--color-accent-700);pointer-events:none\"><i class=\"ph-duotone ph-calendar-blank\" style=\"font-size:18px\"><\u002Fi><\u002Fspan><input type=\"date\" tabindex=\"-1\" style=\"position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;opacity:0;cursor:pointer;border:0;padding:0;margin:0\"><\u002Fdiv><\u002Fdiv>\n              <div class=\"field\"><label>เวลา<\u002Flabel><input class=\"input\" value=\"{{ cal.nw.time }}\" sc-camel-on-change=\"{{ cal.onNtm }}\" placeholder=\"13.30 น.\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>สถานที่ / รูปแบบ<\u002Flabel><input class=\"input\" value=\"{{ cal.nw.place }}\" sc-camel-on-change=\"{{ cal.onNpl }}\" placeholder=\"ห้องประชุม / ผ่านสื่ออิเล็กทรอนิกส์\"><\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ cal.saveNew }}\" style=\"align-self:flex-start\">บันทึก<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cal.hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--color-divider);border-left:4px solid var(--color-accent);border-radius:10px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:8px\"><span style=\"display:flex;flex-direction:column\"><b style=\"font-size:16px\">{{ cal.sel.short }}<\u002Fb><span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 65%,transparent)\">{{ cal.sel.full }}<\u002Fspan><\u002Fspan><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cal.sel.close }}\" style=\"font-size:13px\">ปิด<\u002Fbutton><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:70px 1fr;gap:6px 10px;font-size:13.5px;align-items:center\"><span style=\"color:color-mix(in srgb,var(--color-text) 60%,transparent)\">วันที่<\u002Fspan><span>{{ cal.sel.dateTxt }}<\u002Fspan><span style=\"color:color-mix(in srgb,var(--color-text) 60%,transparent)\">เวลา<\u002Fspan><input class=\"input\" value=\"{{ cal.sel.time }}\" sc-camel-on-change=\"{{ cal.sel.onTime }}\" placeholder=\"ระบุเวลา เช่น 13.30 น.\" style=\"min-height:32px;font-size:13.5px\"><span style=\"color:color-mix(in srgb,var(--color-text) 60%,transparent)\">สถานที่<\u002Fspan><span>{{ cal.sel.place }}<\u002Fspan><span style=\"color:color-mix(in srgb,var(--color-text) 60%,transparent)\">สถานะ<\u002Fspan><span><span class=\"tag tag-outline\">{{ cal.sel.status }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cal.sel.goFold }}\" style=\"font-size:13px\">Meeting Folder<\u002Fbutton><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cal.sel.goIdx }}\" style=\"font-size:13px\">วาระใน Meeting Index<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--color-divider);border-radius:10px;background:#fff\">\n          <b>การประชุมในเดือนนี้ ({{ cal.cnt }})<\u002Fb>\n          <sc-if value=\"{{ cal.noList }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ไม่มีการประชุมในเดือนนี้<\u002Fspan><\u002Fsc-if>\n          <sc-for list=\"{{ cal.list }}\" as=\"e\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ e.pick }}\" style=\"display:grid;grid-template-columns:6px 1fr;gap:10px;text-align:left;font:inherit;color:inherit;background:transparent;border:0;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent);cursor:pointer;opacity:{{ e.op }}\"><span style=\"border-radius:3px;background:{{ e.fg }}\"><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13.5px;font-weight:700\">{{ e.label }} <span style=\"font-weight:400;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">· {{ e.timeTxt }}<\u002Fspan><\u002Fspan><span style=\"font-size:12.5px\">{{ e.dateTxt }}<\u002Fspan><sc-if value=\"{{ e.hasPlace }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ e.place }}<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDecl }}\" hint-placeholder-val=\"{{ false }}\">\n  <sc-if value=\"{{ decl.pvOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ decl.closePv }}\" style=\"z-index:50\">\n    <div class=\"dialog\" sc-camel-on-click=\"{{ stop }}\" style=\"width:min(1180px,100%);height:min(92vh,1200px);display:flex;flex-direction:column;gap:12px;background:var(--color-bg)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"><div class=\"dialog-title\" style=\"margin:0\">{{ decl.pvTitle }}<\u002Fdiv><div style=\"display:flex;gap:8px\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ decl.closePv }}\">ปิด<\u002Fbutton><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ decl.printPv }}\">พิมพ์ / บันทึก PDF<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <iframe sc-camel-src-doc=\"{{ decl.pv }}\" title=\"Declaration preview\" style=\"flex:1;width:100%;border:1px solid var(--color-divider);border-radius:6px;background:#e9e7e4\"><\u002Fiframe>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ decl.listOpen }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;max-width:760px\">\n        <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Register Document · Declaration Document<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:600;line-height:1.3\">แบบรายงานประวัติ ผู้ที่อาจมีความขัดแย้ง และการมีส่วนได้เสียของกรรมการ ผู้บริหาร และผู้ถือหุ้นใหญ่<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">กรอกแบบรายงานรายบุคคล ระบบคำนวณสัดส่วนการถือหุ้น อายุ และ Worksheet นิติบุคคลที่เกี่ยวข้องให้อัตโนมัติ แล้วส่งลิงก์ให้กรรมการแต่ละท่านตรวจสอบ ยืนยัน และลงนามจากภายนอก<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ decl.genAll }}\">สร้างแบบรายงานจากทะเบียนกรรมการ<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ decl.addOne }}\">+ แบบรายงานใหม่<\u002Fbutton>\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ decl.sendAll }}\">ส่งให้กรรมการยืนยันทั้งหมดที่พร้อม<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n      <span style=\"font-size:13.5px;font-weight:600\">บริษัท<\u002Fspan>\n      <sc-raw-select class=\"input\" value=\"{{ decl.coF }}\" sc-camel-on-change=\"{{ decl.onCoF }}\" style=\"flex:0 0 180px;min-height:36px\"><sc-for list=\"{{ decl.coOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <span class=\"tag tag-neutral\">ร่าง {{ decl.cntDraft }}<\u002Fspan><span class=\"tag tag-outline\">รอกรรมการยืนยัน {{ decl.cntSent }}<\u002Fspan><span class=\"tag tag-accent\">ยืนยันแล้ว {{ decl.cntOk }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ decl.noList }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:16px;border:1px dashed var(--color-divider);border-radius:8px;font-size:14px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">ยังไม่มีแบบรายงานของบริษัทนี้ กด \"สร้างแบบรายงานจากทะเบียนกรรมการ\" เพื่อสร้างให้กรรมการทุกท่าน<\u002Fdiv><\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ decl.list }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:minmax(220px,1.4fr) 90px minmax(200px,1.2fr) 120px minmax(150px,auto) auto;gap:12px;align-items:center;padding:12px 16px;background:#fff;border:1px solid var(--color-divider);border-radius:8px;font-size:13.5px\">\n          <button sc-camel-on-click=\"{{ d.open }}\" style=\"display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer;min-width:0\"><span style=\"font-weight:600;font-size:14.5px;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:3px\">{{ d.name }}<\u002Fspan><span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ d.pos }} · {{ d.email }}<\u002Fspan><\u002Fbutton>\n          <span class=\"tag tag-outline\" style=\"justify-self:start\">{{ d.co }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:1px\"><span>ถือหุ้น: {{ d.sh }}<\u002Fspan><span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">นิติบุคคลที่เกี่ยวข้อง {{ d.jurTxt }} · ข้อมูล ณ {{ d.asOf }}<\u002Fspan><sc-if value=\"{{ d.hasWarn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:var(--color-accent-2)\">⚠ ตรวจพบ {{ d.warnN }} จุดที่ควรตรวจสอบ<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:2px;align-items:flex-start\"><span class=\"{{ d.stCls }}\">{{ d.stTxt }}<\u002Fspan><span style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ d.sentTxt }}<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ d.preview }}\" style=\"font-size:13px\">ดูตัวอย่าง<\u002Fbutton><sc-if value=\"{{ d.hasReq }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ d.viewWf }}\" style=\"font-size:13px\">ติดตาม {{ d.reqId }}<\u002Fbutton><\u002Fsc-if><\u002Fspan>\n          <span style=\"display:flex;gap:8px;justify-content:flex-end\"><sc-if value=\"{{ d.canSend }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ d.send }}\" style=\"font-size:13px\">{{ d.sendTxt }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ d.noSend }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ d.viewExt }}\" style=\"font-size:13px\" title=\"จำลองหน้าที่กรรมการเห็นเมื่อเปิดลิงก์จากอีเมล\">มุมมองกรรมการ<\u002Fbutton><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ decl.edOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:22px;max-width:1240px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <button sc-camel-on-click=\"{{ decl.ed.back }}\" style=\"align-self:flex-start;font:inherit;font-size:13px;color:var(--color-accent-700);background:transparent;border:0;padding:0;cursor:pointer\">← กลับไปรายการแบบรายงาน<\u002Fbutton>\n        <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Declaration Document · แบบรายงานประวัติ ผู้ที่อาจมีความขัดแย้ง และการมีส่วนได้เสีย<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-size:20px;font-weight:600\">{{ decl.ed.name }}<\u002Fspan><span class=\"{{ decl.ed.stCls }}\">{{ decl.ed.stTxt }}<\u002Fspan><sc-if value=\"{{ decl.ed.sample }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-neutral\">ตัวอย่างจากแบบที่แนบ<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ decl.ed.preview }}\">ดูตัวอย่าง<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ decl.ed.print }}\">พิมพ์ / PDF<\u002Fbutton>\n        <sc-if value=\"{{ decl.ed.hasReq }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ decl.ed.viewExt }}\" title=\"จำลองหน้าที่กรรมการเห็นเมื่อเปิดลิงก์\">มุมมองกรรมการ<\u002Fbutton><\u002Fsc-if>\n        <sc-if value=\"{{ decl.ed.canSend }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ decl.ed.send }}\">{{ decl.ed.sendTxt }}<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ decl.ed.lockE }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:6px;background:oklch(0.94 0.05 80);color:oklch(0.4 0.09 70);font-size:13.5px\"><span>{{ decl.ed.lockTxt }}<\u002Fspan><span style=\"display:flex;gap:8px\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ decl.ed.viewWf }}\" style=\"font-size:13px\">ดูใน Approval Tracking<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ decl.ed.resetReq }}\" style=\"font-size:13px\">ปลดล็อกเพื่อแก้ไข<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ decl.ed.hasWarns }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:6px;background:oklch(0.96 0.03 20);color:oklch(0.45 0.16 22);font-size:13.5px\"><b>ระบบตรวจพบจุดที่ควรตรวจสอบ<\u002Fb><sc-for list=\"{{ decl.ed.warns }}\" as=\"w\" hint-placeholder-count=\"1\"><span>• {{ w }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n    <fieldset disabled=\"{{ decl.ed.lockE }}\" style=\"border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:22px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 16px;border:1px solid var(--color-divider);border-radius:8px;background:#fff\">\n      <div class=\"field\"><label>บริษัท<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ decl.ed.co }}\" sc-camel-on-change=\"{{ decl.ed.onCo }}\"><sc-for list=\"{{ decl.ed.coOpts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n      <div class=\"field\"><label>ข้อมูล ณ วันที่ (ใช้คำนวณอายุ)<\u002Flabel><div data-date=\"1\" style=\"position:relative;display:flex\"><input data-dt=\"1\" sc-camel-max-length=\"10\" sc-camel-input-mode=\"numeric\" class=\"input\" value=\"{{ decl.ed.asOf }}\" sc-camel-on-change=\"{{ decl.ed.onAsOf }}\" placeholder=\"วว-ดด-ปปปป\" style=\"padding-right:38px;flex:1;min-width:0\"><span style=\"position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--color-accent-700);pointer-events:none\"><i class=\"ph-duotone ph-calendar-blank\" style=\"font-size:20px\"><\u002Fi><\u002Fspan><input type=\"date\" tabindex=\"-1\" style=\"position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;opacity:0;cursor:pointer;border:0;padding:0;margin:0\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\" style=\"grid-column:span 2;min-width:0\"><label>อีเมลกรรมการ (สำหรับส่งลิงก์ให้ยืนยันจากภายนอก)<\u002Flabel><input class=\"input\" value=\"{{ decl.ed.email }}\" sc-camel-on-change=\"{{ decl.ed.onEmail }}\" placeholder=\"name@example.com\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <section style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"align-self:flex-start;border:1px solid var(--color-text);padding:4px 12px;font-weight:700\">ส่วนที่ 1 ข้อมูลทั่วไปของผู้รายงาน<\u002Fspan><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ decl.ed.pull }}\" style=\"font-size:13px\">ดึงข้อมูลจากทะเบียนกรรมการ<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n        <sc-for list=\"{{ decl.ed.p1 }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div class=\"field\" style=\"min-width:0\"><label>{{ f.l }}<\u002Flabel>\n            <sc-if value=\"{{ f.isTxt }}\" hint-placeholder-val=\"{{ true }}\"><input class=\"input\" value=\"{{ f.v }}\" sc-camel-on-change=\"{{ f.on }}\"><\u002Fsc-if>\n            <sc-if value=\"{{ f.isDate }}\" hint-placeholder-val=\"{{ false }}\"><div data-date=\"1\" style=\"position:relative;display:flex\"><input data-dt=\"1\" sc-camel-max-length=\"10\" sc-camel-input-mode=\"numeric\" class=\"input\" value=\"{{ f.v }}\" sc-camel-on-change=\"{{ f.on }}\" placeholder=\"วว-ดด-ปปปป\" style=\"padding-right:38px;flex:1;min-width:0\"><span style=\"position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--color-accent-700);pointer-events:none\"><i class=\"ph-duotone ph-calendar-blank\" style=\"font-size:20px\"><\u002Fi><\u002Fspan><input type=\"date\" tabindex=\"-1\" style=\"position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;opacity:0;cursor:pointer;border:0;padding:0;margin:0\"><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ f.hasHint }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:var(--color-accent-700)\">{{ f.hint }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--color-accent) 6%,transparent)\">\n        <div class=\"field\"><label>สัดส่วนถือหุ้น — ผู้รายงาน (%)<\u002Flabel><input class=\"input\" sc-camel-input-mode=\"decimal\" value=\"{{ decl.ed.shSelf }}\" sc-camel-on-change=\"{{ decl.e มกรรมการอิสระ ได้ถูกกำหนดให้มีความเหมาะสมกับบริบทของกิจการ','วาระการดำรงตำแหน่งของกรรมการอิสระ ได้ถูกกำหนดไว้อย่างชัดเจนและเหมาะสม','คณะกรรมการแต่งตั้งคณะกรรมการชุดย่อยต่าง ๆ เพื่อสนับสนุนการปฏิบัติหน้าที่ของคณะกรรมการในเรื่องต่าง ๆ อย่างเพียงพอ เหมาะสม','หลักเกณฑ์การดำรงตำแหน่งในบริษัทอื่นของกรรมการถูกกำหนดอย่างเหมาะสม ชัดเจน','ประธานกรรมการมีคุณสมบัติเหมาะสม และส่งเสริมการปฏิบัติหน้าที่ของคณะกรรมการ','เลขานุการบริษัทมีคุณสมบัติเหมาะสม ตลอดจนมีความรู้และประสบการณ์ที่ช่วยสนับสนุนการปฏิบัติหน้าที่โดยรวมของคณะกรรมการ']],\n  ['2','บทบาท หน้าที่และความรับผิดชอบของคณะกรรมการ',['กฎบัตรคณะกรรมการมีการกำหนดอำนาจ หน้าที่ ความรับผิดชอบของกรรมการไว้อย่างครบถ้วน ครอบคลุม และเป็นปัจจุบัน','กฎบัตรคณะกรรมการได้รับการพิจารณาทบทวนเป็นประจำ','คณะกรรมการได้อุทิศเวลาอย่างเพียงพอในการพิจารณา / ทบทวนวิสัยทัศน์ พันธกิจ ตลอดจนเป้าหมายหลักของกิจการเป็นประจำ เพื่อการพัฒนาอย่างยั่งยืน',EVK+'ในการกำกับดูแลให้การสรรหาและคัดเลือกกรรมการมีกระบวนการที่โปร่งใสและชัดเจน',EVK+'ในการพิจารณา / ทบทวนโครงสร้างและอัตราค่าตอบแทนของกรรมการให้มีความเหมาะสม',EVK+'ในการพิจารณา / ทบทวนหลักเกณฑ์และวิธีการสรรหากรรมการและประธานเจ้าหน้าที่บริหาร',EVK+'ในการพิจารณา / ทบทวนโครงสร้างค่าตอบแทน หลักเกณฑ์การประเมินผลงานของกรรมการ และประธานเจ้าหน้าที่บริหารที่สอดคล้องกับแผนกลยุทธ์ของกิจการ ทั้งระยะสั้นและระยะยาว','คณะกรรมการได้อุทิศเวลาอย่างเพียงพอสำหรับพิจารณากลยุทธ์และแผนงานประจำปีให้สอดคล้องกับวิสัยทัศน์ พันธกิจ และเป้าหมายหลักของกิจการ',EVK+'ในการพิจารณาความเหมาะสมของการจัดสรรทรัพยากรในด้านต่าง ๆ สำหรับดำเนินการตามกลยุทธ์และแผนงานประจำปี','คณะกรรมการเข้าใจความเสี่ยงที่สำคัญของกิจการ ตลอดจนสามารถพิจารณาความเหมาะสมของระดับ \"ความเสี่ยงที่ยอมรับได้\" เพื่อให้สอดรับกับเป้าหมาย กลยุทธ์ และการเปลี่ยนแปลงของสภาพแวดล้อมทางธุรกิจ',EVK+'ในการพิจารณาอนุมัติกรอบ / นโยบายบริหารความเสี่ยงที่สอดคล้องกับเป้าหมายหลักและกลยุทธ์ของกิจการ',EVK+'ในการทบทวนนโยบายด้านความเสี่ยง ตลอดจนประเมินประสิทธิผลของการจัดการความเสี่ยงอย่างสม่ำเสมอ',EVK+'ในการทบทวนเพื่อให้มั่นใจว่ากิจการมีระบบควบคุมภายใน (Internal Control) ที่เหมาะสมเพียงพอ','คณะกรรมการได้กำหนดกระบวนการพิจารณารายการที่มีความขัดแย้งทางผลประโยชน์ให้มีความเป็นธรรม (Arm-Length Basis) ตลอดจนมีแนวทางการจัดการรายการดังกล่าวให้เป็นไปตามขั้นตอน และมีการเปิดเผยข้อมูลตามที่กฎหมายกำหนด',EVK+'ในการดูแลให้การจัดทำงบการเงินเป็นไปตามมาตรฐานการบัญชีที่รับรองทั่วไป',EVK+'ในการดูแลให้บริษัทเปิดเผยข้อมูลต่าง ๆ ตามกฎเกณฑ์ที่กำหนด',EVK+'ในการพิจารณา ทบทวน และกำกับดูแลให้มีการปฏิบัติตามนโยบายการกำกับดูแลกิจการ / จรรยาบรรณธุรกิจ / การพัฒนาอย่างยั่งยืน','คณะกรรมการได้กำหนดตัวชี้วัดต่าง ๆ สำหรับประเมินผลการปฏิบัติงานของฝ่ายจัดการอย่างชัดเจน และเป็นรูปธรรม','คณะกรรมการได้ติดตามความคืบหน้าของการปฏิบัติหน้าที่ของฝ่ายจัดการอย่างสม่ำเสมอ เพื่อให้มั่นใจว่าเป็นไปตามนโยบาย วัตถุประสงค์ หรือมติของคณะกรรมการ']],\n  ['3','การประชุมคณะกรรมการ',['คณะกรรมการได้รับทราบกำหนดการประชุมฯ ล่วงหน้าตลอดทั้งปี ช่วยให้กรรมการสามารถจัดสรรเวลาเข้าร่วมประชุมได้สะดวก','จำนวนครั้ง / ความถี่ของการจัดประชุมฯ มีความเหมาะสม ช่วยให้คณะกรรมการปฏิบัติหน้าที่กำกับดูแลเรื่องต่าง ๆ ได้อย่างมีประสิทธิภาพ','การประชุมคณะกรรมการแต่ละครั้งมีระยะเวลา (Duration) ที่เหมาะสม','กรรมการได้รับเอกสารประกอบการประชุมล่วงหน้าอย่างน้อย 7 วัน เพื่อให้มีเวลาเพียงพอในการศึกษาข้อมูลเพื่อเตรียมตัวเข้าประชุม','ข้อมูลในเอกสารประกอบการประชุมมีรายละเอียด / สาระสำคัญที่ถูกต้อง ครบถ้วนเพียงพอ และเอื้อต่อการตัดสินใจของกรรมการ','เวลาที่ใช้ในการประชุมมีความเหมาะสม เอื้อให้กรรมการได้อภิปรายและแสดงความคิดเห็นได้อย่างเต็มที่ และมีบรรยากาศการประชุมที่ไม่ถูกครอบงำโดยบุคคลใดบุคคลหนึ่ง','คณะกรรมการมีนโยบายให้กรรมการต้องแจ้งและงดร่วมการพิจารณาหรือเข้าร่วมการประชุมในเรื่องที่มีส่วนได้เสียหรือมีความขัดแย้งทางผลประโยชน์','คณะกรรมการเข้าใจและถือปฏิบัติตามกฎระเบียบในเรื่องการประชุม เช่น การนับองค์ประชุม การวินิจฉัยชี้ขาดของที่ประชุม ฯลฯ อย่างเคร่งครัด','บันทึกการประชุมคณะกรรมการบรรจุเนื้อหาที่มีสาระสำคัญอย่างถูกต้อง ครบถ้วน เพียงพอ สามารถใช้อ้างอิงได้ และมีการรับรองความถูกต้องโดยคณะกรรมการทุกครั้ง']],\n  ['4','พลวัตในการปฏิบัติหน้าที่ของคณะกรรมการ',['กรรมการแต่ละคนเข้าประชุมคณะกรรมการอย่างสม่ำเสมอ','กรรมการเตรียมตัวและศึกษาข้อมูลอย่างเพียงพอมาก่อนการประชุม','กรรมการสามารถลำดับความสำคัญของประเด็นต่าง ๆ และใช้เวลาในการพิจารณาประเด็นนั้น ๆ อย่างเหมาะสม','กรรมการสามารถแสดงความคิดเห็นได้อย่างอิสระ ตั้งคำถามที่ท้าทายและเป็นประโยชน์ต่อการดำเนินธุรกิจ มีความเป็นกลางในการพิจารณาหรือตัดสินใจเรื่องต่าง ๆ','กรรมการมีทัศนคติเปิดกว้างต่อความคิดเห็นที่แตกต่างระหว่างกัน เพื่อสร้างมุมมองที่หลากหลาย โดยมิได้นำไปสู่ความขัดแย้งส่วนบุคคล']],\n  ['5','ความสัมพันธ์กับฝ่ายจัดการ',['คณะกรรมการเปิดโอกาสให้ผู้บริหารระดับสูงสามารถเข้าพบเพื่อหารือหรือขอคำปรึกษาจากคณะกรรมการได้อย่างเปิดเผย ตรงไปตรงมา','คณะกรรมการแสดงออกถึงความเชื่อมั่น (Trust) ให้เกียรติและไว้วางใจต่อการปฏิบัติหน้าที่ของประธานเจ้าหน้าที่บริหาร / ฝ่ายจัดการ','คณะกรรมการได้เข้ามามีส่วนร่วมพิจารณาแก้ไขปัญหาตามความเหมาะสม ในกรณีที่การปฏิบัติหน้าที่ของฝ่ายจัดการไม่เป็นไปตามแผน / งบประมาณที่กำหนด']],\n  ['6','การพัฒนากรรมการ',['กรรมการเข้าใจบทบาท หน้าที่ และความรับผิดชอบของตนในฐานะกรรมการ (ทั้งตามหลักกฎหมาย และหลัก Fiduciary Duty) ตลอดจนมีความรู้ความเข้าใจเกี่ยวกับธุรกิจของบริษัทอย่างเพียงพอที่จะช่วยให้ปฏิบัติหน้าที่กรรมการอย่างมีประสิทธิภาพ','คณะกรรมการได้จัดให้มีการปฐมนิเทศสำหรับกรรมการใหม่ ตลอดจนดูแลให้ฝ่ายจัดการนำส่งเอกสารต่าง ๆ เพื่อให้กรรมการเข้าใจธุรกิจและการปฏิบัติหน้าที่ของตน','คณะกรรมการส่งเสริมให้กรรมการทุกท่านได้รับการฝึกอบรมเพื่อพัฒนาความรู้ ทักษะต่าง ๆ อย่างต่อเนื่อง เพื่อให้เข้าใจการปฏิบัติหน้าที่ในฐานะกรรมการ และตระหนักรู้เท่าทันการเปลี่ยนแปลงของสภาพแวดล้อมทางธุรกิจ']]]},\n {id:'BODS',short:'BOD รายบุคคล',name:'แบบประเมินตนเองของกรรมการ (รายบุคคล)',comm:'BOD',self:true,who:'กรรมการบริษัททุกท่าน ประเมินตนเอง',sc:EVSC4,file:'แบบประเมิน BOD รายบุคคล 2569.pdf',secs:[\n  ['1','คุณสมบัติส่วนบุคคล',[{g:'กรรมการมีคุณสมบัติที่เหมาะสม และเป็นประโยชน์ต่อการกำกับดูแล',items:['ความรู้ ความเชี่ยวชาญ และประสบการณ์','อายุ / ความพร้อมในเชิงกายภาพ','ภาพลักษณ์ / คุณธรรมจริยธรรม / ความเป็นที่ยอมรับนับถือ']},'ในกรณีที่ถูกแต่งตั้งเป็นกรรมการชุดย่อย กรรมการมีคุณสมบัติ ความรู้ ประสบการณ์ที่สอดคล้องกับการทำหน้าที่ในคณะกรรมการชุดย่อยนั้น ๆ']],\n  ['2','ความพร้อมในการปฏิบัติหน้าที่',['กรรมการมีความรู้ ความเข้าใจอย่างเพียงพอเกี่ยวกับบทบาทหน้าที่ และความรับผิดชอบของตน (ทั้งตามหลักกฎหมาย และหลัก Fiduciary Duty)','กรรมการมีความรู้ ความเข้าใจอย่างเพียงพอเกี่ยวกับกิจการ เช่น เป้าหมายหลักของกิจการ ลักษณะการประกอบธุรกิจ ผลิตภัณฑ์หลัก กลุ่มผู้มีส่วนได้ส่วนเสีย ฯลฯ','กรรมการได้ติดตามความเคลื่อนไหว และแนวโน้มต่าง ๆ ภายในอุตสาหกรรมอย่างสม่ำเสมอ เพื่อให้ตระหนักรู้เท่าทันการเปลี่ยนแปลงใด ๆ ที่อาจส่งผลกระทบต่อกิจการ']],\n  ['3','การมีส่วนร่วมในการประชุม',[{g:'ก่อนการประชุม',items:['กรรมการได้ใช้เวลาอย่างเพียงพอในการศึกษาเอกสารและข้อมูลต่าง ๆ ก่อนการประชุมฯ']},{g:'ระหว่างการประชุม',items:['กรรมการได้ให้มุมมอง ความเห็นที่สร้างสรรค์ ท้าทาย และเป็นประโยชน์ต่อที่ประชุมฯ อย่างสม่ำเสมอ','กรรมการออกเสียงเพื่อลงมติในที่ประชุมฯ ได้อย่างเป็นอิสระและเที่ยงธรรม โดยไม่ตกอยู่ใต้อิทธิพลของบุคคลหนึ่งบุคคลใด','กรรมการมีทัศนคติที่เปิดกว้าง มีความเป็นมืออาชีพ และแสดงออกถึงท่าทีของการรับฟังความคิดเห็นที่แตกต่างหลากหลาย','กรรมการให้ความสำคัญต่อการชี้แจงทุกรายการที่ตนเองมีส่วนได้เสีย โดยงดเว้นการเข้าร่วมประชุมและงดออกเสียงในรายการนั้น ๆ','กรรมการยึดถือปฏิบัติตามกฎระเบียบในเรื่องการประชุม เช่น การนับองค์ประชุม การวินิจฉัยชี้ขาดของที่ประชุม ฯลฯ อย่างเคร่งครัด']},{g:'หลังการประชุม',items:['กรรมการได้พิจารณาบันทึกการประชุมคณะกรรมการ (Minute) ทุกครั้ง เพื่อให้แน่ใจว่ามีเนื้อหาสาระสำคัญที่ถูกต้อง และสามารถใช้อ้างอิงได้']}]],\n  ['4','บทบาท หน้าที่ และความรับผิดชอบ',['กรรมการได้ปฏิบัติหน้าที่ของตนตามกฎบัตรคณะกรรมการ (Board Charter) ตลอดจนระเบียบข้อบังคับต่าง ๆ อย่างเคร่งครัด','กรรมการกำกับและติดตามการดำเนินการของฝ่ายจัดการอย่างเหมาะสม ตลอดจนให้ข้อเสนอแนะที่เป็นประโยชน์ โดยไม่แทรกแซงการทำงานของฝ่ายจัดการ','กรรมการมีความทุ่มเทและอุทิศเวลาในการปฏิบัติหน้าที่ ตลอดจนเข้าร่วมกิจกรรมสำคัญต่าง ๆ ของกิจการอย่างสม่ำเสมอ เช่น การประชุมผู้ถือหุ้น เป็นต้น','กรรมการแสดงออกถึงความมุ่งมั่นในการพัฒนาตนเอง และเรียนรู้สิ่งใหม่ ๆ เพื่อเพิ่มพูนทักษะในการปฏิบัติหน้าที่อยู่ตลอดเวลา']],\n  ['5','ความสัมพันธ์กับคณะกรรมการและฝ่ายจัดการ',['กรรมการมีความสัมพันธ์ที่ดีกับกรรมการท่านอื่น ๆ ในคณะกรรมการ','กรรมการมีความสัมพันธ์ที่ดีกับฝ่ายจัดการ']]]},\n {id:'AC',short:'AC',name:'แบบประเมินตนเองของคณะกรรมการตรวจสอบ',comm:'AC',who:'กรรมการตรวจสอบ ประเมินคณะกรรมการตรวจสอบทั้งคณะ',sc:EVSC4,file:'แบบประเมิน AC 2569.pdf',secs:evComm('คณะกรรมการตรวจสอบ','กรรมการตรวจสอบ',[EVK2+'ในการดูแลสอบทานให้กิจการจัดทำรายงานทางการเงินที่ถูกต้องและน่าเชื่อถือ',EVK2+'ในการสอบทานให้บริษัทมีระบบการควบคุมภายใน (Internal Control) ที่เหมาะสมและมีประสิทธิผล','ประสานงานกับคณะกรรมการบริหารความยั่งยืนและความเสี่ยง (ถ้ามี) เกี่ยวกับความเสี่ยงที่สำคัญ เพื่อนำมาใช้เป็นแนวทางในการพิจารณาแผนตรวจสอบภายใน ตลอดจนพิจารณามาตรการควบคุมภายในที่เหมาะสมต่อการจัดการความเสี่ยงเหล่านั้น',EVK2+'ในการพิจารณาความเป็นอิสระของหน่วยงานตรวจสอบภายใน ตลอดจนให้ความเห็นชอบในการพิจารณาแต่งตั้ง โยกย้าย เลิกจ้างหัวหน้าหน่วยงานตรวจสอบภายใน',EVK2+'ในการสอบทานให้กิจการปฏิบัติตามกฎระเบียบ ข้อบังคับต่าง ๆ',EVK2+'ในการพิจารณา คัดเลือก เสนอแต่งตั้งบุคคลซึ่งมีความเป็นอิสระเพื่อทำหน้าที่เป็นผู้สอบบัญชีของบริษัท','จัดให้มีการประชุมร่วมกับผู้สอบบัญชีของบริษัท โดยไม่มีฝ่ายจัดการเข้าร่วมประชุมอย่างน้อยปีละ 1 ครั้ง','ใช้เวลาอย่างเพียงพอในการพิจารณารายการที่เกี่ยวโยงกันหรือรายการที่มีความขัดแย้งทางผลประโยชน์ให้เป็นไปตามกฎหมายหรือข้อกำหนดต่าง ๆ',EVK2+'ในการสอบทานกระบวนการปฏิบัติงานให้สอดคล้องกับนโยบายและมาตรการต่อต้านการทุจริตคอร์รัปชัน','ใช้เวลาอย่างเพียงพอในการสอบทานกระบวนการภายในเกี่ยวกับการรับเรื่องร้องเรียน การแจ้งเบาะแส การรายงานข้อกังวล ฯลฯ ให้มีความเหมาะสม'],false)},\n {id:'NRC',short:'NRC',name:'แบบประเมินตนเองของคณะกรรมการสรรหาและกำหนดค่าตอบแทน',comm:'NRC',who:'กรรมการสรรหาและกำหนดค่าตอบแทน ประเมินคณะกรรมการทั้งคณะ',sc:EVSC4,file:'แบบประเมิน NRC 2569.pdf',secs:evComm('คณะกรรมการสรรหาและกำหนดค่าตอบแทน','กรรมการสรรหาและกำหนดค่าตอบแทน',['พิจารณาทบทวนจำนวน โครงสร้าง และองค์ประกอบของคณะกรรมการบริษัทให้เหมาะสมกับขนาด ประเภท และความซับซ้อนของธุรกิจอย่างสม่ำเสมอ พร้อมให้ข้อเสนอแนะที่เป็นประโยชน์ต่อคณะกรรมการ',EVK2+'ในการพิจารณานโยบาย หลักเกณฑ์ และกระบวนการในการสรรหาบุคคลที่เหมาะสมจะเป็นกรรมการ / ผู้บริหารระดับสูง เพื่อนำเสนอให้คณะกรรมการพิจารณาเห็นชอบ',EVK2+'ในการรับผิดชอบดูแลกระบวนการสรรหาและคัดเลือกกรรมการให้มีประสิทธิภาพ โปร่งใส และเที่ยงธรรม','ใช้เวลาอย่างเพียงพอในการทบทวนคุณสมบัติและประเมินผลกรรมการที่มีกำหนดครบวาระ เพื่อพิจารณาถึงความเหมาะสมของการแต่งตั้งกรรมการท่านดังกล่าวกลับเข้ามาดำรงตำแหน่งต่ออีกวาระหนึ่ง',EVK2+'ในการกำหนดแนวทาง หลักเกณฑ์ วิธีการ และกระบวนการประเมินผลงานของคณะกรรมการ คณะกรรมการชุดย่อย กรรมการรายบุคคล ประธานเจ้าหน้าที่บริหาร ตลอดจนผู้บริหารระดับสูง',EVK2+'ในการดูแลให้มีการจัดทำแผนพัฒนากรรมการ เพื่อเสริมสร้างศักยภาพในด้านต่าง ๆ ของกรรมการอย่างต่อเนื่อง',EVK2+'ในการจัดให้มีแผนสืบทอดตำแหน่ง (Succession Plan) ของกรรมการและผู้บริหารระดับสูง เพื่อให้การบริหารงานของกิจการเป็นไปอย่างต่อเนื่อง',EVK2+'ในการพัฒนานโยบายการจ่ายค่าตอบแทนของกรรมการและผู้บริหารระดับสูงในรูปแบบต่าง ๆ ทั้งที่เป็นตัวเงินและไม่เป็นตัวเงิน เพื่อเสนอต่อคณะกรรมการพิจารณาอนุมัติ',EVK2+'สำหรับพิจารณาวิธีการและหลักเกณฑ์การกำหนดค่าตอบแทนที่เป็นธรรม โปร่งใส และสมเหตุสมผล',EVK2+'ในการทบทวนความเหมาะสมของเกณฑ์การกำหนดค่าตอบแทนที่ใช้อยู่ในปัจจุบันอย่างสม่ำเสมอ เพื่อให้สอดรับกับภาระความรับผิดชอบของตำแหน่งนั้น ๆ ผลประกอบการ ขนาดของกิจการ ตลอดจนแนวปฏิบัติภายในอุตสาหกรรม'],true)},\n {id:'RMC',short:'RMC',name:'แบบประเมินตนเองของคณะกรรมการบริหารความยั่งยืนและความเสี่ยง',comm:'RMC',who:'กรรมการบริหารความยั่งยืนและความเสี่ยง ประเมินคณะกรรมการทั้งคณะ',sc:EVSC4,file:'แบบประเมิน RMC 2569.pdf',secs:evComm('คณะกรรมการบริหารความยั่งยืนและความเสี่ยง','กรรมการบริหารความยั่งยืนและความเสี่ยง',[EVK2+'ในการพัฒนาหรือสอบทานกรอบ / นโยบายบริหารความยั่งยืนและความเสี่ยงทั่วทั้งองค์กร เพื่อเสนอให้คณะกรรมการเห็นชอบ','ให้ความสำคัญและเสริมสร้างให้กิจการมีวัฒนธรรมที่ตระหนักถึงความเสี่ยง (Risk-aware Culture) โดยปฏิบัติตนเป็นแบบอย่าง',EVK2+'ในการทบทวนความเหมาะสมของความเสี่ยงที่ยอมรับได้ (Risk Appetite) เพื่อให้สอดคล้องกับแผนกลยุทธ์และเป้าหมายธุรกิจ รวมถึงสภาวการณ์ที่เปลี่ยนแปลงไป',EVK2+'ในการติดตามความเสี่ยงใหม่ ๆ (Emerging Risk) ที่มาจากทั้งปัจจัยภายในและภายนอกอย่างสม่ำเสมอ','ใช้เวลาอย่างเพียงพอในการกำกับดูแลกระบวนการบริหารความเสี่ยง (ซึ่งครอบคลุมทั้งการระบุ ประเมิน ควบคุม และติดตามความเสี่ยง) เพื่อให้มั่นใจว่ากระบวนการดังกล่าวมีประสิทธิภาพ',EVK2+'ในการพิจารณา / ติดตามผลการดำเนินงานตามแผนบริหารความเสี่ยง เพื่อให้มั่นใจว่าความเสี่ยงต่าง ๆ อยู่ในระดับที่ยอมรับได้','ประสานงานกับคณะกรรมการตรวจสอบเกี่ยวกับความเสี่ยงที่สำคัญ เพื่อให้คณะกรรมการตรวจสอบนำไปใช้เป็นแนวทางในการพิจารณาแผนตรวจสอบภายใน ตลอดจนพิจารณามาตรการควบคุมภายในที่เหมาะสมต่อการจัดการความเสี่ยงเหล่านั้น','เปิดโอกาสให้ฝ่ายจัดการ / ส่วนงานที่รับผิดชอบด้านการบริหารความยั่งยืนและความเสี่ยงภายในองค์กรเข้าหารือเพื่อขอคำปรึกษา / ข้อเสนอแนะที่เป็นประโยชน์'],true)},\n {id:'CEO',short:'CEO',name:'แบบประเมินผลงานของประธานเจ้าหน้าที่บริหาร (CEO)',comm:'BOD',ceo:true,who:'กรรมการบริษัท (ยกเว้น CEO) ประเมินผลงานของ CEO',sc:EVSC5,file:'แบบประเมิน CEO 2569.pdf',secs:[\n  ['1','ความเป็นผู้นำ',['CEO ได้แสดงถึงวิสัยทัศน์ที่ชัดเจนในการคาดการณ์แนวโน้มทางธุรกิจ โอกาสทางธุรกิจ และลำดับความสำคัญทางธุรกิจที่ส่งผลต่อความเจริญรุ่งเรืองและการดำเนินงานของบริษัทฯ อย่างถูกต้อง','CEO สามารถแปลงวิสัยทัศน์และกลยุทธ์ให้เป็นแผนธุรกิจหรือแผนปฏิบัติการที่เป็นไปได้ เพื่อบรรลุผลสำเร็จในเชิงกลยุทธ์ขององค์กรได้อย่างชัดเจน','CEO สามารถสื่อสารแนวคิด วิสัยทัศน์ พันธกิจ กลยุทธ์ เป้าหมาย และทิศทางขององค์กรต่อผู้มีส่วนได้เสียอย่างถูกต้อง','CEO สามารถสร้างแรงจูงใจและส่งเสริมให้พนักงานมีขวัญกำลังใจที่ดีและทำงานร่วมกันเป็นทีม เพื่อบรรลุวิสัยทัศน์ขององค์กรได้อย่างมีประสิทธิผล','CEO ได้ปฏิบัติตัวเป็นแบบอย่างที่ดีขององค์กร มีรูปแบบการทำงานซึ่งเปิดรับคำแนะนำที่สร้างสรรค์ และแสดงออกถึงภาวะผู้นำในระดับที่เหมาะสมสำหรับองค์กร','CEO เป็นผู้ริเริ่มในการกำหนดมาตรฐานการปฏิบัติงานในระดับสูง และมุ่งมั่นอย่างสูงในการบรรลุเป้าหมายด้วยพลังขับเคลื่อนของตน','CEO แสดงภาวะผู้นำด้านธรรมาภิบาลและจริยธรรม โดยยึดหลักความโปร่งใสและความรับผิดชอบต่อผู้มีส่วนได้เสีย']],\n  ['2','การกำหนดกลยุทธ์',['CEO สามารถพัฒนาพันธกิจ นโยบาย และแผนยุทธศาสตร์ที่ชัดเจน ที่สามารถสนองต่อความต้องการของผู้ถือหุ้น ลูกค้า พนักงาน และผู้มีส่วนได้เสียอื่น ๆ อย่างลงรอยกัน','CEO สามารถระบุและวิเคราะห์ปัญหาและประเด็นที่องค์กรต้องเผชิญอยู่อย่างถูกต้อง','CEO สามารถกำหนดและประเมินปัจจัยความสำเร็จที่สำคัญ เพื่อการกำหนดกลยุทธ์ขององค์กรได้อย่างถูกต้อง','CEO สามารถสร้างความมั่นใจได้ว่าแผนยุทธศาสตร์ถูกจัดทำขึ้นโดยที่คณะกรรมการ ผู้บริหารระดับสูง และพนักงานคนอื่น ๆ มีส่วนร่วม และมีความรู้สึกเป็นเจ้าของในแผนงานนั้น','CEO สามารถสร้างความมั่นใจได้ว่าทรัพยากรและงบประมาณของบริษัทฯ มีความเหมาะสมสำหรับการทำงานตามแผนยุทธศาสตร์ขององค์กร','CEO สามารถสร้างกระบวนการที่ทำให้การติดตามดูแลและการควบคุมสามารถทำงานได้ เพื่อให้มั่นใจว่าประสิทธิผลของการดำเนินงานและการบริหารความเสี่ยงขององค์กรได้รับความสำเร็จ','CEO สนับสนุนการเชื่อมโยงกลยุทธ์องค์กรกับเป้าหมายด้านความยั่งยืน (ESG / SDGs)']],\n  ['3','การปฏิบัติตามกลยุทธ์',['CEO ได้กำหนดโครงสร้างองค์กรที่มีประสิทธิผล และสร้างความมั่นใจว่าการบริหารจัดการมีการมุ่งเน้นฟังก์ชันที่จำเป็นที่จะช่วยให้องค์กรปฏิบัติตามภารกิจได้','CEO ได้บริหารงานและมอบหมายงานอย่างถูกต้อง รวมถึงการปฏิบัติหน้าที่ในขอบเขตความรับผิดชอบ และมอบหมายหน้าที่ต่าง ๆ ให้ผู้อื่นรับผิดชอบอย่างมืออาชีพ','CEO มีการตัดสินใจที่ดีอย่างสม่ำเสมอ และสามารถปรับเปลี่ยนกลยุทธ์อย่างทันท่วงทีเมื่อเห็นว่าเงื่อนไขหรือสภาวะส่งสัญญาณให้เห็นถึงความจำเป็นต้องมีการเปลี่ยนแปลง','CEO ได้ดำเนินการตามกลยุทธ์ตามลำดับความสำคัญ และตามมาตรการที่คณะกรรมการบริษัทกำหนด ภายในระยะเวลาที่เหมาะสมและอย่างมีประสิทธิผล','CEO ได้กำกับการติดตามดูแลและการควบคุมผลการปฏิบัติงานอย่างถูกต้อง เพื่อให้มั่นใจว่าพนักงานทุกระดับในองค์กรมีความรับผิดชอบต่อการปฏิบัติหน้าที่','CEO ให้ความมั่นใจได้ว่าการดำเนินงานของบริษัทฯ เป็นไปตามข้อกำหนดของกฎหมาย ข้อบังคับ และมาตรฐานการกำกับดูแลกิจการ รวมทั้งได้ติดตามดูแลระบบบริหารความเสี่ยงขององค์กรให้มีประสิทธิผลและเป็นส่วนหนึ่งของการดำเนินกลยุทธ์']],\n  ['4','การวางแผนและผลปฏิบัติทางการเงิน',['CEO มีความเข้าใจดีในตัวชี้วัดทางการเงินที่เกี่ยวข้องกับธุรกิจและสถานะทางการเงินของบริษัทฯ','CEO สามารถตัดสินใจได้ดีในการบริหารกิจกรรมทางการเงินและงบประมาณขององค์กร','CEO สามารถกำหนดวิธีการและแนวปฏิบัติที่เหมาะสม เพื่อให้การบัญชีและการวางแผนทางการเงินมีความถูกต้อง แม่นยำ และเป็นปัจจุบัน','CEO มีการติดตามดูแลและประเมินผลการวางแผนทางการเงิน งบประมาณ และการดำเนินงานของบริษัทฯ อย่างมีประสิทธิผล และรายงานต่อคณะกรรมการตามกำหนดเวลาที่เหมาะสม','CEO สามารถทำให้บริษัทฯ บรรลุเป้าหมายทางการเงินและส่วนแบ่งการตลาดที่ได้กำหนดไว้','CEO ให้ความมั่นใจได้ว่าบริษัทมีการจัดทำบัญชีที่มีคุณภาพระดับมืออาชีพ จนได้รับผลการตรวจสอบงบการเงินที่ถูกต้องปราศจากเงื่อนไข','CEO มีการบริหารจัดการความเสี่ยงทางการเงินและปัจจัยภายนอกที่อาจส่งผลต่อธุรกิจ เช่น ความผันผวนของอัตราแลกเปลี่ยน ดอกเบี้ย หรือภาวะเศรษฐกิจ']],\n  ['5','ความสัมพันธ์กับคณะกรรมการ',['CEO สามารถสร้างความสัมพันธ์อันดีและแน่นแฟ้นในการทำงานร่วมกับคณะกรรมการ ช่วยสร้างความเข้มแข็งให้คณะกรรมการ ทำให้สามารถทำงานร่วมกับคณะกรรมการด้วยความร่วมมือและใกล้ชิดในการพัฒนาพันธกิจและแผนกลยุทธ์ขององค์กรทั้งระยะสั้น ระยะปานกลาง และระยะยาว','CEO มีความรู้ดีพอในด้านกระบวนการกำกับดูแลกิจการของคณะกรรมการ และได้ปฏิบัติตามแนวทางดังกล่าวอย่างสม่ำเสมอ รวมถึงการใช้มาตรการที่เหมาะสมและการถ่วงดุลอำนาจระหว่าง CEO ในฐานะผู้นำองค์กรกับคณะกรรมการ','CEO ได้จัดเตรียมวาระการประชุมที่เหมาะสม พร้อมทั้งจัดสรรเวลาที่เพียงพอสำหรับการอภิปรายประเด็นต่าง ๆ ในการประชุม โดยมีการจัดเตรียมข้อมูลเอกสารที่เกี่ยวข้องกับประเด็นต่าง ๆ ของวาระการประชุมเป็นการล่วงหน้า','CEO มีการนำเสนอข้อมูลต่อคณะกรรมการในประเด็นที่ต้องการความเห็นและการตัดสินใจจากคณะกรรมการอย่างมืออาชีพ โดยเสนอความเห็นเพื่อพิจารณาที่ผ่านการศึกษาวิเคราะห์อย่างละเอียดถี่ถ้วนตามหลักการที่ถูกต้อง เหมาะสม','CEO มีความพร้อมที่จะให้คณะกรรมการแต่ละคนพบเมื่อมีความจำเป็น รวมถึงการสนับสนุนคณะกรรมการในการปฏิบัติหน้าที่การกำกับดูแล โดยการจัดหาทรัพยากรที่จำเป็นและการอำนวยความสะดวกต่าง ๆ','CEO ส่งเสริมสนับสนุนการเรียนรู้และการพัฒนาศักยภาพของคณะกรรมการ รวมถึงบทบาทของคณะกรรมการในชุมชนและในฐานะกระบอกเสียงของบริษัทฯ']],\n  ['6','ความสัมพันธ์กับภายนอก',['CEO ได้ทำหน้าที่เป็นตัวแทนของบริษัทฯ ในการสื่อสารต่อผู้มีส่วนได้เสีย รวมถึงองค์กรและกลุ่มชุมชนต่าง ๆ ได้อย่างมีประสิทธิผล','CEO ได้สื่อสารถึงผลการดำเนินงานทางการเงินและแนวโน้มในอนาคตของบริษัทฯ ให้กับผู้มีส่วนได้เสียและกลุ่มนักลงทุนอย่างมีประสิทธิผล','CEO ได้จัดการกับประเด็นการประชาสัมพันธ์อย่างมืออาชีพ สร้างค่านิยมและภาพลักษณ์ที่ดีให้องค์กร และลดประเด็นปัญหาต่าง ๆ จากชุมชนและสาธารณชนทั่วไป','CEO ได้ส่งเสริมการดำเนินธุรกิจด้วยความรับผิดชอบต่อสังคมและการมีส่วนร่วมของชุมชนในการส่งเสริมภาพลักษณ์ที่ดีของบริษัทฯ รวมทั้งสร้างความตระหนักในผลิตภัณฑ์และบริการขององค์กรที่เสนอให้กับชุมชนและสาธารณชนทั่วไป','CEO ให้ความมั่นใจได้ว่าบริษัทฯ รักษาความสัมพันธ์อันดีกับชุมชน และบ่มเพาะความสัมพันธ์ที่ดีในการทำงานร่วมกันกับองค์กรและกลุ่มชุมชน']],\n  ['7','การบริหารงานและความสัมพันธ์กับบุคลากร',['CEO ได้สร้างและธำรงไว้ซึ่งบรรยากาศและวัฒนธรรมองค์กรที่ดึงดูด รักษา และโน้มน้าวพนักงานให้ปฏิบัติตามพันธกิจ ทิศทางเชิงกลยุทธ์ และเป้าหมายขององค์กร','CEO ได้ให้ความเป็นอิสระและอำนาจหน้าที่ในการทำงานต่อพนักงานในระดับที่เหมาะสม รวมถึงสนับสนุนและเสริมสร้างให้มีความคิดริเริ่มและความคิดสร้างสรรค์ภายในองค์กรได้อย่างดี','CEO ได้พัฒนาและดำเนินกระบวนการและแนวปฏิบัติด้านบุคลากรอย่างเหมาะสม ซึ่งรวมไปถึงระบบการประเมินผลและการให้รางวัลสำหรับผู้บริหารและพนักงาน ที่จะส่งผลให้ทุกคนทำงานเพื่อเป้าหมายเดียวกันได้อย่างดี','CEO ได้สนับสนุนการศึกษาและการพัฒนาบุคลากร ส่งเสริมให้บุคลากรที่เหมาะสมมีส่วนร่วมในการวางแผนและการตัดสินใจ รวมถึงเปิดโอกาสให้พนักงานสามารถทำงานในด้านที่พนักงานมีความเชี่ยวชาญเพื่อประโยชน์ขององค์กร','CEO ได้สร้างหรือมีการว่าจ้างทีมผู้บริหารระดับสูงที่มีความสามารถ มีความรู้ ทักษะ มีพลังและความมุ่งมั่นที่จะทำให้พันธกิจและวิสัยทัศน์ขององค์กรเป็นจริง','CEO ให้ความมั่นใจได้ว่าบริษัทฯ มีการสื่อสารภายในองค์กรที่ดี และได้ปฏิบัติต่อบุคลากรอย่างเป็นธรรม ไม่ลำเอียง หรือเลือกปฏิบัติ','CEO ส่งเสริมความหลากหลาย ความเท่าเทียม และการมีส่วนร่วม (Diversity, Equity & Inclusion: DEI) ในทุกระดับขององค์กร']],\n  ['8','การสืบทอดตำแหน่ง',['CEO ได้มีการทบทวนแผนสืบทอดตำแหน่ง รวมถึงการปรับปรุงเปลี่ยนแปลงแผนสืบทอดโดยคำนึงถึงสภาวะต่าง ๆ ทั้งภายนอกและภายในองค์กรอย่างมีประสิทธิผล','CEO ได้มีการสร้างกระบวนการและโปรแกรมที่จำเป็นในการสร้างสายการเติบโตความเป็นผู้นำที่มีความสามารถ เพื่ออนาคตขององค์กร','CEO ให้ความมั่นใจได้ว่าผู้บริหารที่มีศักยภาพพอที่จะเป็นผู้บริหารระดับสูง มีโอกาสแสดงผลงานให้เป็นที่ประจักษ์ต่อคณะกรรมการ']],\n  ['9','ความรู้ด้านผลิตภัณฑ์และบริการ',['CEO ได้แสดงให้เห็นว่ามีความรู้และความเข้าใจเป็นอย่างดีเกี่ยวกับลักษณะสำคัญของผลิตภัณฑ์และการบริการของบริษัทฯ','CEO ได้แสดงให้เห็นว่ามีความรู้และความเข้าใจเป็นอย่างดีในการจัดการและการดำเนินงานของบริษัทฯ','CEO ได้แสดงให้เห็นว่ามีความรู้และความเข้าใจเป็นอย่างดีในรูปแบบธุรกิจและการจัดสรรทรัพยากรของบริษัทฯ รวมถึงเข้าใจสภาพแวดล้อมทางธุรกิจและอุตสาหกรรม','CEO ได้แสดงให้เห็นถึงการมีความคิดสร้างสรรค์และความคิดริเริ่มในการสร้างผลิตภัณฑ์และบริการใหม่อย่างสม่ำเสมอ']],\n  ['10','คุณลักษณะส่วนตัว',['CEO มีการสร้างภาพลักษณ์ที่มีผลเชิงบวกต่อบริษัทฯ รวมถึงแสดงบุคลิกภาพ การมองการณ์ไกล และทัศนคติที่ทำให้ผู้มีส่วนได้เสียให้ความเชื่อถือและให้การสนับสนุน','CEO แสดงให้เห็นการปฏิบัติตนและความเคารพต่อผู้อื่น ตลอดจนแสดงความใส่ใจต่อผู้ใต้บังคับบัญชาเป็นรายบุคคล','CEO มีการใช้ดุลยพินิจที่ดีในการแก้ปัญหาที่อ่อนไหว ทั้งปัญหาระหว่างบุคคลและปัญหาระหว่างกลุ่ม','CEO ได้แสดงให้เห็นถึงทักษะในการวิเคราะห์และหยิบยกปัญหา ความท้าทาย และความขัดแย้งต่าง ๆ รวมถึงไม่ย่อท้อต่องานที่มีลักษณะคลุมเครือและซับซ้อน','CEO ได้รักษาไว้ซึ่งมาตรฐานระดับสูงทางจริยธรรมและความซื่อสัตย์สุจริต รวมถึงความสมดุลในการบริหารเวลาและการลำดับความสำคัญทั้งในเรื่องงานและเรื่องส่วนตัวได้เป็นอย่างดี','CEO ได้มีการพัฒนาทักษะในด้านต่าง ๆ ที่จำเป็นต่อการพัฒนาศักยภาพของตนอย่างสม่ำเสมอ']]],\n  open:[['11.1','จุดแข็งที่สำคัญที่ CEO ควรรักษาไว้มีอะไรบ้าง'],['11.2','ประเด็นที่ CEO ควรได้รับการพัฒนามากขึ้นในปีถัดไปมีอะไรบ้าง']]}];\nconst evBuild=d=>{const secs=[],items=[];d.secs.forEach(([no,t,L])=>{const rows=[];L.forEach((x,i)=>{const n=no+'.'+(i+1);if(typeof x==='string'){rows.push({no:n,t:x});items.push({no:n,t:x,sec:no});}else{rows.push({no:n,t:x.g,h:true});x.items.forEach((y,k)=>{const m=n+'.'+(k+1);rows.push({no:m,t:y});items.push({no:m,t:y,sec:no});});}});secs.push({no,t,rows});});const sv=d.sc.map(x=>x[0]);return {...d,secs,items,lo:Math.min(...sv),hi:Math.max(...sv),open:d.open||[]};};\nconst EVF=EV_DEF.map(evBuild);\nconst EV_DUP=[\n {id:'b1',f:'BODG',type:'merge',q:['2.4','2.6'],keep:'2.4',drop:'2.6',why:'ทั้งสองข้อถามเรื่องการสรรหากรรมการ — ข้อ 2.4 ถามความโปร่งใสของกระบวนการ ข้อ 2.6 ถามหล
